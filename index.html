
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zyro">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Zyro AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #05070d;
      color: #f5f7ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      max-width: 760px;
      min-height: 100vh;
      margin: auto;
      padding: calc(env(safe-area-inset-top) + 22px) 18px
        calc(env(safe-area-inset-bottom) + 24px);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 34px;
    }

    .logo {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .orb {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #fff, #4be4ff 25%, #455bff 65%, #14152b);
      box-shadow: 0 0 25px #4be4ff55;
    }

    h1 {
      font-size: clamp(36px, 9vw, 54px);
      line-height: 1.05;
      margin: 0 0 12px;
    }

    .muted { color: #8d9ab5; }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 25px 0;
    }

    .card {
      min-height: 125px;
      padding: 17px;
      text-align: left;
      border: 1px solid #202b43;
      border-radius: 20px;
      background: #0b1020;
      color: white;
      cursor: pointer;
    }

    .card b {
      display: block;
      margin: 12px 0 5px;
      font-size: 16px;
    }

    .card span {
      color: #91a0bb;
      font-size: 13px;
    }

    .chat {
      margin: 22px 0;
    }

    .msg {
      display: flex;
      margin: 12px 0;
    }

    .bubble {
      max-width: 88%;
      padding: 13px 15px;
      border-radius: 18px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .ai {
      background: #10182a;
      border: 1px solid #25314b;
    }

    .me {
      margin-left: auto;
      background: #345dff;
    }

    .composer {
      position: sticky;
      bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px;
      border: 1px solid #26314a;
      border-radius: 20px;
      background: #0b1020f5;
      backdrop-filter: blur(15px);
    }

    textarea {
      flex: 1;
      width: 100%;
      min-width: 0;
      max-height: 140px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font: inherit;
      padding: 10px 4px;
    }

    button {
      min-height: 43px;
      border: 0;
      border-radius: 14px;
      padding: 0 14px;
      background: #4be4ff;
      color: #061018;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .mic {
      background: #192540;
      color: #b9f8ff;
    }

    .note {
      font-size: 12px;
      line-height: 1.5;
      color: #8290aa;
    }

    @media (max-width: 360px) {
      main { padding-left: 12px; padding-right: 12px; }
      .composer { gap: 5px; }
      .composer button { padding: 0 10px; }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div class="logo">ZYRO</div>
      <div class="orb" aria-label="Zyro AI"></div>
    </header>

    <h1>Your AI.<br>Your way.</h1>
    <p class="muted">Chat, explore ideas, and get things done with Zyro.</p>

    <section class="cards">
      <button class="card" onclick="focusPrompt()">
        <div>💬</div>
        <b>AI Chat</b>
        <span>Ask questions and explore ideas</span>
      </button>

      <button class="card" onclick="voice()">
        <div>🎙️</div>
        <b>Voice</b>
        <span>Speak your message</span>
      </button>

      <button class="card" onclick="createPrompt('image')">
        <div>🖼️</div>
        <b>Image Ideas</b>
        <span>Create an image prompt</span>
      </button>

      <button class="card" onclick="createPrompt('video')">
        <div>🎬</div>
        <b>Video Ideas</b>
        <span>Create a video prompt</span>
      </button>
    </section>

    <section id="chat" class="chat" aria-live="polite">
      <div class="msg">
        <div class="bubble ai">
          Hey! I'm Zyro. What would you like to work on?
        </div>
      </div>
    </section>

    <form class="composer" id="chatForm">
      <button type="button" class="mic" onclick="voice()" aria-label="Voice input">🎙️</button>
      <textarea id="prompt" rows="1" placeholder="Message Zyro…" aria-label="Message Zyro"></textarea>
      <button type="submit" id="sendButton" aria-label="Send message">➤</button>
    </form>

    <p class="note">
      Zyro uses an AI provider to answer messages. Provider usage limits apply.
      Image and video features currently help prepare prompts; they do not generate media yet.
    </p>
  </main>

  <script>
    const promptBox = document.getElementById("prompt");
    const chat = document.getElementById("chat");
    const sendButton = document.getElementById("sendButton");
    const chatForm = document.getElementById("chatForm");

    function focusPrompt() {
      promptBox.focus();
    }

    function addMessage(text, isUser) {
      const row = document.createElement("div");
      row.className = "msg";

      const bubble = document.createElement("div");
      bubble.className = "bubble " + (isUser ? "me" : "ai");
      bubble.textContent = text;

      row.appendChild(bubble);
      chat.appendChild(row);
      row.scrollIntoView({ behavior: "smooth", block: "end" });

      return bubble;
    }

    async function send() {
      const message = promptBox.value.trim();

      if (!message || sendButton.disabled) return;

      addMessage(message, true);
      promptBox.value = "";
      sendButton.disabled = true;

      const reply = addMessage("Thinking…", false);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Request failed.");
        }

        reply.textContent = data.text || "The AI returned an empty response.";
      } catch (error) {
        reply.textContent =
          "I couldn't get a response. Check that your Render deployment succeeded and that GROQ_API_KEY is configured. " +
          "Details: " + error.message;
      } finally {
        sendButton.disabled = false;
        focusPrompt();
      }
    }

    chatForm.addEventListener("submit", event => {
      event.preventDefault();
      send();
    });

    function voice() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("Voice input isn't supported in this browser. Please type your message instead.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onresult = event => {
        promptBox.value = event.results[0][0].transcript;
        send();
      };

      recognition.onerror = () => {
        alert("Voice input failed. Please try again or type your message.");
      };

      recognition.start();
    }

    function createPrompt(type) {
      promptBox.value = type === "image"
        ? "Help me write a detailed image-generation prompt for "
        : "Help me write a detailed video-generation prompt for ";

      focusPrompt();
    }
  </script>
</body>
</html>
